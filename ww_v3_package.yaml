# =============================================================================
# Home Assistant Package: Warmwassersteuerung ww_v3
# Migration von ww_v2 (Bosch-Cloud-Anbindung water_heater.dhw1/switch.charge)
# auf die lokale EMS-ESP-Gateway-Anbindung. Siehe ww_v3_analysis.md,
# ww_v3_migration_concept.md, ww_v3_entity_mapping.md und ww_v3_function_matrix.md
# fuer die vollstaendige Begruendung jeder Aenderung. Alle Migrationsentscheidungen
# wurden vom Anwender bestaetigt (siehe ww_v3_open_questions.md Teil A).
#
# WICHTIGSTE AENDERUNG GEGENUEBER v2:
# - water_heater.dhw1 (Bosch Home Connect Cloud) wird NICHT MEHR referenziert.
# - switch.charge / number.charge_setpoint / number.charge_duration (Bosch
#   Cloud) werden NICHT MEHR referenziert.
# - Einzige Quelle fuer Warmwasser-Ist-Temperatur und Ladesteuerung ist jetzt
#   das lokale EMS-ESP-Gateway (sensor.boiler_dhw_curtemp,
#   switch.boiler_dhw_onetime, number.boiler_dhw_seltempsingle).
# - Das native EMS-ESP-Feature "PV laedt Warmwasser auf"
#   (switch.thermostat_pvenabledhw) wird von ww_v3 aktiv deaktiviert gehalten,
#   damit ausschliesslich ww_v3 ueber Ladeentscheidungen bestimmt (keine
#   doppelte, unkoordinierte Steuerung).
#
# Ziel (unveraendert gegenueber v2):
# - Komfort und Sicherheit sicherstellen
# - PV-Ueberschuss zweier Anlagen (Ost/West), Tibber-Preis und Batteriespeicher
#   wirtschaftlich nutzen
# - Verdichterstarts reduzieren (Anti-Takt, Mindestlaufzeit)
# - Jede Entscheidung nachvollziehbar protokollieren (zentrales Debug-/
#   Pushover-System, per input_boolean.ww_v3_debug_mode schaltbar)
#
# Wichtige Sicherheitsgrenze:
# Der optionale Hygienezyklus ist standardmaessig AUS. Er darf nur aktiviert
# werden, wenn Speicher, Rohrnetz und Verbruehschutz vom Fachbetrieb fuer die
# eingestellte Temperatur freigegeben wurden. Die Funktion ersetzt keine
# Herstellerfunktion oder fachliche Trinkwasserbewertung. Zusaetzlich prueft
# v3 vor jedem Ladevorgang, ob number.boiler_dhw_maxtemp (Geraete-eigenes
# Maximum) das gewuenschte Ziel ueberhaupt zulaesst (siehe script
# ww_v3_ladung_starten) - das war in v2 unverifiziert (siehe
# ww_v2_open_questions.md).
# =============================================================================

