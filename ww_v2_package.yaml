# =============================================================================
# Home Assistant Package: Warmwassersteuerung ww_v2
# Neuaufbau von v1_8 gemaess ww_v2_analysis.md / ww_v2_function_matrix.md /
# ww_v2_entity_mapping.md. Alle Rueckfragen wurden vom Anwender beantwortet
# (siehe ww_v2_open_questions.md). Es werden ausschliesslich bestaetigte bzw.
# nachweislich vorhandene Entities referenziert. Keine Bosch-Entity wird
# verwendet (Ausnahme: water_heater.dhw1 selbst, vom Anwender ausdruecklich
# bestaetigt, siehe Analyse Abschnitt "externe Quell-Entities").
#
# Ziel:
# - Komfort und Sicherheit sicherstellen, ohne Bosch-Abhaengigkeit
# - PV-Ueberschuss zweier Anlagen (Ost/West), Tibber-Preis und Batteriespeicher
#   wirtschaftlich nutzen
# - Verdichterstarts reduzieren (Anti-Takt, Mindestlaufzeit)
# - Jede Entscheidung nachvollziehbar protokollieren (zentrales Debug-/
#   Pushover-System, per input_boolean.ww_v2_debug_mode schaltbar)
#
# Wichtige Sicherheitsgrenze:
# Der optionale Hygienezyklus ist standardmaessig AUS. Er darf nur aktiviert
# werden, wenn Speicher, Rohrnetz und Verbruehschutz vom Fachbetrieb fuer die
# eingestellte Temperatur freigegeben wurden. Die Funktion ersetzt keine
# Herstellerfunktion oder fachliche Trinkwasserbewertung.
# =============================================================================

