sensor:
  # Kumulierter WP-Energiezaehler aus Momentanleistung sensor.wp_gesamtleistung.
  # Bestaetigt durch Anwender (offene Frage 2, Antwort a): weiterhin per
  # Riemann-Integration aus der Momentanleistung, nicht aus dem alternativen
  # Shelly-Energiezaehler sensor.warmepumpe_device_energy.
  - platform: integration
    source: sensor.wp_gesamtleistung
    name: WW V2 WP Energie Gesamt
    unique_id: ww_v2_wp_energie_gesamt
    unit_time: h
    round: 3
    method: trapezoidal

  - platform: statistics
    name: WW V2 Temperatur Maximum 7 Tage
    unique_id: ww_v2_temperatur_maximum_7_tage
    entity_id: sensor.ww_v2_warmwassertemperatur
    state_characteristic: value_max
    max_age:
      days: 7
    sampling_size: 20000
    precision: 1

# Wochen-/Monats-Energieverbrauch der Waermepumpe (gemessen, Nutzerantwort Q12).
utility_meter:
  ww_v2_wp_energie_woche:
    source: sensor.ww_v2_wp_energie_gesamt
    name: WW V2 WP Energie Woche
    cycle: weekly
  ww_v2_wp_energie_monat:
    source: sensor.ww_v2_wp_energie_gesamt
    name: WW V2 WP Energie Monat
    cycle: monthly

template:
  - binary_sensor:
      - name: WW V2 System aktiv
        unique_id: ww_v2_system_aktiv
        state: "{{ is_state('input_boolean.ww_v2_aktiv','on') }}"

      - name: WW V2 Manuelle Uebersteuerung
        unique_id: ww_v2_manuelle_uebersteuerung
        state: "{{ not is_state('input_boolean.ww_v2_aktiv','on') }}"

      - name: WW V2 Ladung aktiv
        unique_id: ww_v2_ladung_aktiv
        device_class: heat
        state: "{{ is_state('switch.charge','on') }}"

      # Priorität 1 der Aufgabenstellung: Pflichtdaten pruefen, bevor irgendeine
      # andere Entscheidung getroffen wird. Wird als Bedingung in allen
      # ladeausloesenden Automationen verwendet.
      - name: WW V2 Pflichtdaten gueltig
        unique_id: ww_v2_pflichtdaten_gueltig
        state: >-
          {{ states('sensor.ww_v2_warmwassertemperatur') not in ['unknown','unavailable']
             and states('switch.charge') not in ['unknown','unavailable'] }}

      - name: WW V2 PV Ost verfuegbar
        unique_id: ww_v2_pv_ost_verfuegbar
        device_class: connectivity
        state: "{{ states('sensor.stp10_0_3av_40_040_pv_power_a') not in ['unknown','unavailable'] }}"

      - name: WW V2 PV West verfuegbar
        unique_id: ww_v2_pv_west_verfuegbar
        device_class: connectivity
        state: "{{ states('sensor.stp10_0_3av_40_040_pv_power_b') not in ['unknown','unavailable'] }}"

      - name: WW V2 Kritischer Bedarf
        unique_id: ww_v2_kritischer_bedarf
        device_class: problem
        availability: "{{ states('sensor.ww_v2_warmwassertemperatur') not in ['unknown','unavailable'] }}"
        state: >-
          {{ states('sensor.ww_v2_warmwassertemperatur') | float(99)
             < states('input_number.ww_v2_kritisches_minimum') | float(44) }}

      - name: WW V2 Komfortbedarf
        unique_id: ww_v2_komfortbedarf
        availability: "{{ states('sensor.ww_v2_warmwassertemperatur') not in ['unknown','unavailable'] }}"
        state: >-
          {{ states('sensor.ww_v2_warmwassertemperatur') | float(99)
             < states('input_number.ww_v2_komfort_minimum') | float(47) }}

      - name: WW V2 Ladebedarf
        unique_id: ww_v2_ladebedarf
        availability: "{{ states('sensor.ww_v2_warmwassertemperatur') not in ['unknown','unavailable'] }}"
        state: >-
          {% set t = states('sensor.ww_v2_warmwassertemperatur') | float(99) %}
          {% set z = states('sensor.ww_v2_effektives_ziel') | float(51) %}
          {% set h = states('input_number.ww_v2_start_hysterese') | float(2) %}
          {{ t < z - h }}

      # PV-Ueberschuss weiterhin aus sensor.evu_leistung abgeleitet
      # (Nutzerantwort Q6, unveraendert gegenueber v1_8).
      - name: WW V2 PV-Ueberschuss
        unique_id: ww_v2_pv_ueberschuss
        delay_on: "00:03:00"
        delay_off: "00:02:00"
        availability: "{{ states('sensor.evu_leistung') not in ['unknown','unavailable'] }}"
        state: >-
          {{ states('sensor.evu_leistung') | float(0)
             <= 0 - states('input_number.ww_v2_einspeiseschwelle') | float(1000) }}

      - name: WW V2 Eigenverbrauch wirtschaftlich
        unique_id: ww_v2_eigenverbrauch_wirtschaftlich
        state: >-
          {{ states('sensor.ww_v2_eigenverbrauchsvorteil') | float(-99)
             >= states('input_number.ww_v2_mindestvorteil') | float(3) }}

      - name: WW V2 Tibber wirtschaftlich
        unique_id: ww_v2_tibber_wirtschaftlich
        state: >-
          {% set aktuell = states('sensor.ww_v2_tibber_preis') | float(999) %}
          {% set avg = states('sensor.ww_v2_tibber_leading24') | float(999) %}
          {{ is_state('binary_sensor.home_bestpreis_zeitraum','on') or aktuell <= avg }}

      - name: WW V2 Marstek verfuegbar
        unique_id: ww_v2_marstek_verfuegbar
        device_class: connectivity
        state: >-
          {% set s = states('sensor.marstek_venus_modbus_soc_batterie') %}
          {{ is_state('input_boolean.ww_v2_marstek_nutzen','on')
             and s not in ['unknown','unavailable',''] }}

      - name: WW V2 Marstek freigegeben
        unique_id: ww_v2_marstek_freigegeben
        state: >-
          {{ is_state('binary_sensor.ww_v2_marstek_verfuegbar','on')
             and states('sensor.marstek_venus_modbus_soc_batterie') | float(0)
             >= states('input_number.ww_v2_marstek_freigabe_soc') | float(80)
             and is_state('binary_sensor.ww_v2_pv_ueberschuss','on') }}

      - name: WW V2 Antitakt frei
        unique_id: ww_v2_antitakt_frei
        state: >-
          {% set e = states('input_datetime.ww_v2_letztes_ladeende') %}
          {% set s = states('input_number.ww_v2_antitakt_sperre') | float(20) %}
          {{ e in ['unknown','unavailable',''] or
             (now() - as_datetime(e)).total_seconds() / 60 >= s }}

      - name: WW V2 Mindestlaufzeit erreicht
        unique_id: ww_v2_mindestlaufzeit_erreicht
        state: >-
          {% set a = states('input_datetime.ww_v2_letzte_ladung') %}
          {% set m = states('input_number.ww_v2_mindestlaufzeit') | float(30) %}
          {{ a in ['unknown','unavailable',''] or
             (now() - as_datetime(a)).total_seconds() / 60 >= m }}

      - name: WW V2 Hygiene faellig
        unique_id: ww_v2_hygiene_faellig
        device_class: problem
        state: >-
          {% set max7 = states('sensor.ww_v2_temperatur_maximum_7_tage') | float(0) %}
          {% set ziel = states('input_number.ww_v2_hygiene_ziel') | float(60) %}
          {{ is_state('input_boolean.ww_v2_hygiene_aktiv','on') and max7 < ziel }}

  - sensor:
      # Zentrale, validierte Warmwasser-Ist-Temperatur. Einzige Quelle:
      # water_heater.dhw1 / current_temperature (verifiziert: 52.2, Bereich
      # 0-100 °C, numerisch). Kein Bosch-Fallback, kein Fantasiewert bei
      # ungueltigen Daten - der Sensor wird stattdessen 'unavailable'.
      - name: WW V2 Warmwassertemperatur
        unique_id: ww_v2_warmwassertemperatur
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: >-
          {% set t = state_attr('water_heater.dhw1','current_temperature') %}
          {{ states('water_heater.dhw1') not in ['unknown','unavailable']
             and t is not none and (t | float(none)) is not none }}
        state: "{{ state_attr('water_heater.dhw1','current_temperature') | float(0) | round(1) }}"
        attributes:
          quelle: water_heater.dhw1 / current_temperature
          wasserheizer_betriebsmodus: "{{ states('water_heater.dhw1') }}"
          aktualisiert_vor_sekunden: >-
            {% set lu = states.water_heater.dhw1.last_updated %}
            {{ ((now() - lu).total_seconds() | round(0)) if lu is not none else 'unbekannt' }}
          veraltet: >-
            {% set lu = states.water_heater.dhw1.last_updated %}
            {{ (now() - lu).total_seconds() > 1800 if lu is not none else true }}

      - name: WW V2 Tibber Preis
        unique_id: ww_v2_tibber_preis
        unit_of_measurement: "ct/kWh"
        device_class: monetary
        state_class: measurement
        availability: "{{ states('sensor.home_aktueller_strompreis') not in ['unknown','unavailable'] }}"
        state: "{{ states('sensor.home_aktueller_strompreis') | float(0) | round(3) }}"

      - name: WW V2 Tibber Leading24
        unique_id: ww_v2_tibber_leading24
        unit_of_measurement: "ct/kWh"
        device_class: monetary
        state_class: measurement
        availability: "{{ states('sensor.home_preis_vorlaufend_24h') not in ['unknown','unavailable'] }}"
        state: "{{ states('sensor.home_preis_vorlaufend_24h') | float(0) | round(3) }}"

      # Ersatz fuer die fragile Attribut-Ratekette aus v1_8: direkte,
      # bestaetigt vorhandene Sensoren des Tibber-Preis-Addons verwenden.
      - name: WW V2 Naechster Bestpreis-Start
        unique_id: ww_v2_naechster_bestpreis_start
        icon: mdi:clock-star-four-points
        availability: "{{ states('sensor.home_bestpreis_startet') not in ['unknown','unavailable',''] }}"
        state: >-
          {{ as_timestamp(states('sensor.home_bestpreis_startet')) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}
        attributes:
          quelle: sensor.home_bestpreis_startet

      - name: WW V2 Naechster Bestpreis in
        unique_id: ww_v2_naechster_bestpreis_in
        unit_of_measurement: min
        device_class: duration
        availability: "{{ states('sensor.home_bestpreis_startet_in') not in ['unknown','unavailable',''] }}"
        state: "{{ states('sensor.home_bestpreis_startet_in') | float(0) | round(0) }}"

      - name: WW V2 Eigenverbrauchsvorteil
        unique_id: ww_v2_eigenverbrauchsvorteil
        unit_of_measurement: "ct/kWh"
        state_class: measurement
        state: >-
          {{ (states('sensor.ww_v2_tibber_preis') | float(0)
              - states('input_number.ww_v2_einspeiseverguetung') | float(8)) | round(2) }}

      - name: WW V2 Marstek Stufe
        unique_id: ww_v2_marstek_stufe
        state: >-
          {% set s = states('sensor.marstek_venus_modbus_soc_batterie') | float(-1) %}
          {% set f = states('input_number.ww_v2_marstek_freigabe_soc') | float(80) %}
          {% set g = states('input_number.ww_v2_marstek_schutz_soc') | float(50) %}
          {% if not is_state('binary_sensor.ww_v2_marstek_verfuegbar','on') %}offline
          {% elif s >= f %}Freigabe
          {% elif s >= g %}Eingeschraenkt
          {% else %}Schutz{% endif %}

      - name: WW V2 Verbrauchsprognose
        unique_id: ww_v2_verbrauchsprognose
        unit_of_measurement: K
        state_class: measurement
        state: >-
          {% if now().hour < 12 %}
            {{ states('input_number.ww_v2_verbrauch_morgen_gelernt') | float(4) }}
          {% else %}
            {{ states('input_number.ww_v2_verbrauch_abend_gelernt') | float(3) }}
          {% endif %}
        attributes:
          zeitraum: "{{ 'Morgen' if now().hour < 12 else 'Abend' }}"

      # --- PV Ost/West: aktuelle Leistung -------------------------------
      # Ost = Anlage 1 = sensor.stp10_..._pv_power_a
      # West = Anlage 2 = sensor.stp10_..._pv_power_b
      # (Nutzerantwort Q3, physisch ein SMA-Wechselrichter mit zwei Strings)
      - name: WW V2 PV Leistung Ost
        unique_id: ww_v2_pv_leistung_ost
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_state('binary_sensor.ww_v2_pv_ost_verfuegbar','on') }}"
        state: "{{ states('sensor.stp10_0_3av_40_040_pv_power_a') | float(0) | round(0) }}"

      - name: WW V2 PV Leistung West
        unique_id: ww_v2_pv_leistung_west
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ is_state('binary_sensor.ww_v2_pv_west_verfuegbar','on') }}"
        state: "{{ states('sensor.stp10_0_3av_40_040_pv_power_b') | float(0) | round(0) }}"

      - name: WW V2 PV Leistung Gesamt
        unique_id: ww_v2_pv_leistung_gesamt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {{ is_state('binary_sensor.ww_v2_pv_ost_verfuegbar','on')
             or is_state('binary_sensor.ww_v2_pv_west_verfuegbar','on') }}
        state: >-
          {% set ov = is_state('binary_sensor.ww_v2_pv_ost_verfuegbar','on') %}
          {% set wv = is_state('binary_sensor.ww_v2_pv_west_verfuegbar','on') %}
          {{ ((states('sensor.ww_v2_pv_leistung_ost') | float(0)) if ov else 0)
             + ((states('sensor.ww_v2_pv_leistung_west') | float(0)) if wv else 0) }}
        attributes:
          modus: >-
            {% set ov = is_state('binary_sensor.ww_v2_pv_ost_verfuegbar','on') %}
            {% set wv = is_state('binary_sensor.ww_v2_pv_west_verfuegbar','on') %}
            {% if ov and wv %}beide Anlagen
            {% elif ov %}nur Ost (West ausgefallen)
            {% elif wv %}nur West (Ost ausgefallen)
            {% else %}keine Anlage verfuegbar{% endif %}

      # --- Netz: Bezug/Einspeisung/Ueberschuss (Nutzerantworten Q5, Q6) -
      # sensor.evu_leistung: positiv = Netzbezug, negativ = Einspeisung.
      - name: WW V2 Netzbezug Watt
        unique_id: ww_v2_netzbezug_watt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.evu_leistung') not in ['unknown','unavailable'] }}"
        state: "{{ [states('sensor.evu_leistung') | float(0), 0] | max | round(0) }}"

      - name: WW V2 Netzeinspeisung Watt
        unique_id: ww_v2_netzeinspeisung_watt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.evu_leistung') not in ['unknown','unavailable'] }}"
        state: "{{ [0 - (states('sensor.evu_leistung') | float(0)), 0] | max | round(0) }}"

      - name: WW V2 PV Ueberschuss Watt
        unique_id: ww_v2_pv_ueberschuss_watt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.evu_leistung') not in ['unknown','unavailable'] }}"
        state: "{{ [0 - (states('sensor.evu_leistung') | float(0)), 0] | max | round(0) }}"

      # --- PV-Forecast kombiniert Ost+West (Nutzerantwort Q4: bestehende
      # Summen-Sensoren funktionieren nicht, eigene Summenbildung noetig) --
      - name: WW V2 PV Forecast Rest Heute Gesamt
        unique_id: ww_v2_pv_forecast_rest_heute_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: >-
          {{ states('sensor.energy_production_today_remaining') not in ['unknown','unavailable']
             or states('sensor.energy_production_today_remaining_2') not in ['unknown','unavailable'] }}
        state: >-
          {% set o = states('sensor.energy_production_today_remaining') %}
          {% set w = states('sensor.energy_production_today_remaining_2') %}
          {% set ov = o not in ['unknown','unavailable'] %}
          {% set wv = w not in ['unknown','unavailable'] %}
          {{ (((o | float(0)) if ov else 0) + ((w | float(0)) if wv else 0)) | round(2) }}
        attributes:
          ost_verfuegbar: "{{ states('sensor.energy_production_today_remaining') not in ['unknown','unavailable'] }}"
          west_verfuegbar: "{{ states('sensor.energy_production_today_remaining_2') not in ['unknown','unavailable'] }}"

      - name: WW V2 PV Forecast Morgen Gesamt
        unique_id: ww_v2_pv_forecast_morgen_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: >-
          {{ states('sensor.energy_production_tomorrow') not in ['unknown','unavailable']
             or states('sensor.energy_production_tomorrow_2') not in ['unknown','unavailable'] }}
        state: >-
          {% set o = states('sensor.energy_production_tomorrow') %}
          {% set w = states('sensor.energy_production_tomorrow_2') %}
          {% set ov = o not in ['unknown','unavailable'] %}
          {% set wv = w not in ['unknown','unavailable'] %}
          {{ (((o | float(0)) if ov else 0) + ((w | float(0)) if wv else 0)) | round(2) }}
        attributes:
          ost_verfuegbar: "{{ states('sensor.energy_production_tomorrow') not in ['unknown','unavailable'] }}"
          west_verfuegbar: "{{ states('sensor.energy_production_tomorrow_2') not in ['unknown','unavailable'] }}"

      - name: WW V2 PV Forecast naechste Stunde Gesamt
        unique_id: ww_v2_pv_forecast_naechste_stunde_gesamt
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        availability: >-
          {{ states('sensor.energy_next_hour') not in ['unknown','unavailable']
             or states('sensor.energy_next_hour_2') not in ['unknown','unavailable'] }}
        state: >-
          {% set o = states('sensor.energy_next_hour') %}
          {% set w = states('sensor.energy_next_hour_2') %}
          {% set ov = o not in ['unknown','unavailable'] %}
          {% set wv = w not in ['unknown','unavailable'] %}
          {{ (((o | float(0)) if ov else 0) + ((w | float(0)) if wv else 0)) | round(2) }}

      - name: WW V2 Dynamisches Ziel
        unique_id: ww_v2_dynamisches_ziel
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {% set normal = states('input_number.ww_v2_normalziel') | float(51) %}
          {% set komfort = states('input_number.ww_v2_komfort_minimum') | float(47) %}
          {% set maximum = states('input_number.ww_v2_maximaltemperatur') | float(55) %}
          {% set verlust = states('input_number.ww_v2_nachtverlust_gelernt') | float(4) %}
          {% set bedarf = states('sensor.ww_v2_verbrauchsprognose') | float(4) %}
          {% set pv_m = states('sensor.ww_v2_pv_forecast_morgen_gesamt') | float(-1) %}
          {% set pv_schwach = states('input_number.ww_v2_schwache_pv_schwelle') | float(10) %}
          {% set pv_gut = states('input_number.ww_v2_pv_tag_schwelle') | float(20) %}
          {% set n = namespace(z=normal) %}
          {% if komfort + verlust + bedarf * 0.35 > n.z %}{% set n.z = komfort + verlust + bedarf * 0.35 %}{% endif %}
          {% if pv_m >= 0 and pv_m < pv_schwach %}{% set n.z = n.z + 1.5 %}
          {% elif pv_m >= pv_gut * 1.5 %}{% set n.z = n.z - 1 %}{% endif %}
          {% set z = [[n.z, komfort] | max, maximum] | min %}
          {{ (z * 2) | round(0) / 2 }}
        attributes:
          begruendung: >-
            gelernter Nachtverlust={{ states('input_number.ww_v2_nachtverlust_gelernt') }}K;
            Verbrauchsprognose={{ states('sensor.ww_v2_verbrauchsprognose') }}K;
            PV morgen Ost+West={{ states('sensor.ww_v2_pv_forecast_morgen_gesamt') }}kWh

      - name: WW V2 Effektives Ziel
        unique_id: ww_v2_effektives_ziel
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.ww_v2_pv_vorrang','on')
                and is_state('binary_sensor.ww_v2_pv_ueberschuss','on')
                and is_state('binary_sensor.ww_v2_eigenverbrauch_wirtschaftlich','on') %}
            {{ states('input_number.ww_v2_maximaltemperatur') | float(55) }}
          {% else %}
            {{ states('sensor.ww_v2_dynamisches_ziel') | float(51) }}
          {% endif %}
        attributes:
          modus: >-
            {% if is_state('binary_sensor.ww_v2_pv_ueberschuss','on')
                  and is_state('binary_sensor.ww_v2_eigenverbrauch_wirtschaftlich','on') %}PV-Waermespeicher
            {% else %}dynamisch{% endif %}

      - name: WW V2 Aktive Strategie
        unique_id: ww_v2_aktive_strategie
        state: >-
          {% if not is_state('input_boolean.ww_v2_aktiv','on') %}Deaktiviert
          {% elif is_state('binary_sensor.ww_v2_kritischer_bedarf','on') %}P0 Kritischer Schutz
          {% elif is_state('switch.charge','on') %}{{ states('input_text.ww_v2_aktive_strategie') }}
          {% elif is_state('binary_sensor.ww_v2_ladebedarf','on') %}Warten auf wirtschaftliches Fenster
          {% else %}Bereitschaft{% endif %}

      - name: WW V2 Naechste Ladung
        unique_id: ww_v2_naechste_ladung
        state: >-
          {% if not is_state('input_boolean.ww_v2_aktiv','on') %}Optimierung aus
          {% elif is_state('switch.charge','on') %}laeuft gerade
          {% elif not is_state('binary_sensor.ww_v2_ladebedarf','on') %}nicht erforderlich
          {% elif is_state('binary_sensor.ww_v2_kritischer_bedarf','on') %}sofort
          {% elif is_state('binary_sensor.ww_v2_pv_ueberschuss','on') and is_state('binary_sensor.ww_v2_eigenverbrauch_wirtschaftlich','on') %}jetzt: PV
          {% elif is_state('binary_sensor.ww_v2_tibber_wirtschaftlich','on') %}jetzt: Tibber
          {% elif states('sensor.ww_v2_naechster_bestpreis_start') not in ['unknown','unavailable','nicht verfuegbar',''] %}{{ states('sensor.ww_v2_naechster_bestpreis_start') }}
          {% else %}spaetestens 04:00 Uhr{% endif %}

      - name: WW V2 Ampel
        unique_id: ww_v2_ampel
        state: >-
          {% if states('sensor.ww_v2_warmwassertemperatur') in ['unknown','unavailable']
                or is_state('binary_sensor.ww_v2_kritischer_bedarf','on') %}rot
          {% elif states('sensor.ww_v2_tibber_preis') in ['unknown','unavailable']
                or (states('sensor.energy_production_today') in ['unknown','unavailable']
                    and states('sensor.energy_production_today_2') in ['unknown','unavailable'])
                or not is_state('input_boolean.ww_v2_aktiv','on') %}orange
          {% else %}gruen{% endif %}
        attributes:
          klartext: >-
            {% if states('sensor.ww_v2_warmwassertemperatur') in ['unknown','unavailable'] %}Warmwassertemperatur fehlt
            {% elif is_state('binary_sensor.ww_v2_kritischer_bedarf','on') %}kritisches Minimum unterschritten
            {% elif not is_state('input_boolean.ww_v2_aktiv','on') %}Optimierung deaktiviert
            {% elif states('sensor.ww_v2_tibber_preis') in ['unknown','unavailable'] %}Tibber-Preis fehlt
            {% elif states('sensor.energy_production_today') in ['unknown','unavailable'] and states('sensor.energy_production_today_2') in ['unknown','unavailable'] %}PV-Prognose beider Anlagen fehlt
            {% else %}alle Kernfunktionen verfuegbar{% endif %}

      - name: WW V2 Kosten Woche geschaetzt
        unique_id: ww_v2_kosten_woche_geschaetzt
        unit_of_measurement: EUR
        state_class: measurement
        state: >-
          {{ ((states('sensor.ww_v2_wp_energie_woche') | float(0))
              * (states('sensor.ww_v2_tibber_preis') | float(0)) / 100) | round(2) }}
        attributes:
          hinweis: "Geschaetzt mit aktuellem Strompreis, nicht mit dem historischen Preis je Ladevorgang"

      - name: WW V2 Kosten Monat geschaetzt
        unique_id: ww_v2_kosten_monat_geschaetzt
        unit_of_measurement: EUR
        state_class: measurement
        state: >-
          {{ ((states('sensor.ww_v2_wp_energie_monat') | float(0))
              * (states('sensor.ww_v2_tibber_preis') | float(0)) / 100) | round(2) }}
        attributes:
          hinweis: "Geschaetzt mit aktuellem Strompreis, nicht mit dem historischen Preis je Ladevorgang"

      - name: WW V2 Kostenstatus
        unique_id: ww_v2_kostenstatus
        state: "{{ states('input_number.ww_v2_kosten_heute') | float(0) | round(2) }} EUR heute"
        attributes:
          einsparung_eur: "{{ states('input_number.ww_v2_einsparung_heute') }}"
          pv_energie_kwh: "{{ states('input_number.ww_v2_pv_energie_heute') }}"
          netz_energie_kwh: "{{ states('input_number.ww_v2_netz_energie_heute') }}"
          einspeiseverguetung_ct: "{{ states('input_number.ww_v2_einspeiseverguetung') }}"
          kosten_woche_geschaetzt_eur: "{{ states('sensor.ww_v2_kosten_woche_geschaetzt') }}"
          kosten_monat_geschaetzt_eur: "{{ states('sensor.ww_v2_kosten_monat_geschaetzt') }}"
          energiezaehler_konfiguriert: >-
            {% set e = states('input_text.ww_v2_wp_energy_entity') %}
            {{ e not in ['unknown','unavailable',''] and states(e) not in ['unknown','unavailable',''] }}

      # --- Diagnose ------------------------------------------------------
      - name: WW V2 Diagnose Pflichtentities
        unique_id: ww_v2_diagnose_pflichtentities
        state: >-
          {% set ids = ['water_heater.dhw1','switch.charge','sensor.home_aktueller_strompreis',
                        'sensor.energy_production_today','sensor.energy_production_today_2',
                        'sensor.evu_leistung','sensor.gesamtleistung_haushalt'] %}
          {% set ns = namespace(fehlend=[]) %}
          {% for e in ids %}
            {% if states(e) in ['unknown','unavailable'] %}
              {% set ns.fehlend = ns.fehlend + [e] %}
            {% endif %}
          {% endfor %}
          {{ ns.fehlend | count }} nicht verfuegbar
        attributes:
          fehlende_entities: >-
            {% set ids = ['water_heater.dhw1','switch.charge','sensor.home_aktueller_strompreis',
                          'sensor.energy_production_today','sensor.energy_production_today_2',
                          'sensor.evu_leistung','sensor.gesamtleistung_haushalt'] %}
            {% set ns = namespace(fehlend=[]) %}
            {% for e in ids %}
              {% if states(e) in ['unknown','unavailable'] %}
                {% set ns.fehlend = ns.fehlend + [e] %}
              {% endif %}
            {% endfor %}
            {{ ns.fehlend | join(', ') if ns.fehlend else 'keine' }}

      - name: WW V2 Last Action
        unique_id: ww_v2_last_action
        icon: mdi:text-box-outline
        state: "{{ states('input_text.ww_v2_status_action') }}"

      - name: WW V2 Last Reason
        unique_id: ww_v2_last_reason
        icon: mdi:text-box-outline
        state: "{{ states('input_text.ww_v2_status_reason') }}"

      - name: WW V2 Last Result
        unique_id: ww_v2_last_result
        icon: mdi:text-box-outline
        state: "{{ states('input_text.ww_v2_status_result') }}"

      - name: WW V2 Last Error
        unique_id: ww_v2_last_error
        icon: mdi:alert-circle-outline
        state: "{{ states('input_text.ww_v2_status_error') }}"

      - name: WW V2 Last Pushover Status
        unique_id: ww_v2_last_pushover_status
        icon: mdi:bell-outline
        state: "{{ states('input_text.ww_v2_status_pushover') }}"

# =============================================================================
# Zentrale Skripte
# =============================================================================
script:
  # Zentrales Debug-/Pushover-Skript (Abschnitt 17 der Aufgabenstellung).
  # Wird von JEDER Automation/jedem Skript aufgerufen, das eine Entscheidung
  # oder Aktion protokollieren soll. Aktualisiert IMMER die lokalen
  # Status-Entities; sendet Pushover NUR wenn input_boolean.ww_v2_debug_mode
  # an ist, mit Deduplizierung identischer Meldungen.
  ww_v2_debug_log:
    alias: WW V2 - Zentrales Debug-Log
    mode: queued
    max: 20
    fields:
      source:
        description: Auslösende Automation/Skript
      trigger:
        description: Auslösender Trigger
        default: ""
      decision:
        description: Getroffene Entscheidung
        default: ""
      reason:
        description: Begründung
        default: ""
      action:
        description: Ausgeführte Aktion
        default: ""
      result:
        description: Ergebnis
        default: ""
      severity:
        description: "info | warning | error | critical"
        default: "info"
      error:
        description: Fehlermeldung
        default: ""
      send_pushover:
        description: Pushover-Versand grundsätzlich erlauben
        default: true
    variables:
      v_source: "{{ source | default('unbekannt') }}"
      v_trigger: "{{ trigger | default('') }}"
      v_decision: "{{ decision | default('') }}"
      v_reason: "{{ reason | default('') }}"
      v_action: "{{ action | default('') }}"
      v_result: "{{ result | default('') }}"
      v_severity: "{{ severity | default('info') }}"
      v_error: "{{ error | default('') }}"
      v_send_pushover: "{{ send_pushover | default(true) }}"
      ts: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      signatur: "{{ (v_source ~ '|' ~ v_decision ~ '|' ~ v_reason ~ '|' ~ v_action ~ '|' ~ v_result ~ '|' ~ v_severity) | truncate(250, True, '') }}"
      nachricht: >-
        WW DEBUG
        Zeit: {{ ts }}
        Quelle: {{ v_source }}
        Trigger: {{ v_trigger }}
        Temperatur: {{ states('sensor.ww_v2_warmwassertemperatur') }} °C
        Charge: {{ states('switch.charge') }}
        Ziel: {{ states('sensor.ww_v2_effektives_ziel') }} °C
        PV Ost: {{ states('sensor.ww_v2_pv_leistung_ost') }} W
        PV West: {{ states('sensor.ww_v2_pv_leistung_west') }} W
        Ueberschuss: {{ states('sensor.ww_v2_pv_ueberschuss_watt') }} W
        Preis: {{ states('sensor.ww_v2_tibber_preis') }} ct/kWh
        Entscheidung: {{ v_decision }}
        Grund: {{ v_reason }}
        Aktion: {{ v_action }}
        Ergebnis: {{ v_result }}{{ '\nFehler: ' ~ v_error if v_error != '' else '' }}
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_status_action
        data:
          value: "{{ v_action | truncate(250) }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_status_reason
        data:
          value: "{{ v_reason | truncate(250) }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_status_result
        data:
          value: "{{ v_result | truncate(250) }}"
      - if:
          - condition: template
            value_template: "{{ v_severity in ['error','critical'] }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.ww_v2_status_error
            data:
              value: "{{ v_error | truncate(250) }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ww_v2_letzter_fehler_zeit
            data:
              datetime: "{{ ts }}"
          - service: counter.increment
            target:
              entity_id: counter.ww_v2_fehler_gesamt
      - if:
          - condition: template
            value_template: "{{ v_result == 'Erfolgreich' }}"
        then:
          - service: counter.increment
            target:
              entity_id: counter.ww_v2_aktionen_gesamt
      - if:
          - condition: template
            value_template: "{{ 'Blockiert' in v_decision or 'Blockiert' in v_result }}"
        then:
          - service: counter.increment
            target:
              entity_id: counter.ww_v2_blockierte_aktionen
      - service: logbook.log
        data:
          name: WW V2
          message: "{{ v_decision }} – {{ v_reason }} ({{ v_action }} / {{ v_result }})"
          entity_id: switch.charge
      - if:
          - condition: template
            value_template: >-
              {% set letzte = as_timestamp(states('input_datetime.ww_v2_letzte_pushover_zeit'), 0) %}
              {% set minuten = (as_timestamp(now()) - letzte) / 60 %}
              {% set gleich = signatur == states('input_text.ww_v2_letzte_debug_nachricht') %}
              {{ is_state('input_boolean.ww_v2_debug_mode','on') and v_send_pushover
                 and not (gleich and minuten < (states('input_number.ww_v2_pushover_mindestabstand_min') | float(15))) }}
        then:
          - service: notify.pushover
            continue_on_error: true
            data:
              title: "WW V2 {{ v_severity | upper }}"
              message: "{{ nachricht }}"
          - service: input_text.set_value
            target:
              entity_id: input_text.ww_v2_letzte_debug_nachricht
            data:
              value: "{{ signatur }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ww_v2_letzte_pushover_zeit
            data:
              datetime: "{{ ts }}"
          - service: input_text.set_value
            target:
              entity_id: input_text.ww_v2_status_pushover
            data:
              value: "gesendet {{ ts }}: {{ v_decision | truncate(150) }}"

  # Eigenstaendiger Pushover-Test, unabhaengig vom Debug-Modus und von der
  # Deduplizierung, damit der Versandweg jederzeit gezielt geprueft werden
  # kann (Abschnitt 18 der Aufgabenstellung: "Testfunktion für Pushover").
  ww_v2_pushover_test:
    alias: WW V2 - Pushover Testnachricht
    mode: single
    sequence:
      - service: notify.pushover
        continue_on_error: true
        data:
          title: "WW V2 Test"
          message: "Testnachricht von ww_v2_debug_test um {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_status_pushover
        data:
          value: "Testnachricht gesendet um {{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ww_v2_letzte_pushover_zeit
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # Ladung starten - mit expliziten Schutzmechanismen gegen Mehrfachauslösung,
  # ungültige Temperatur und nicht verfügbaren Schalter (Abschnitt 3.2).
  ww_v2_ladung_starten:
    alias: WW V2 - Ladung starten
    mode: single
    fields:
      grund:
        description: Ladegrund
      hygiene:
        description: Hygieneziel verwenden
        default: false
    variables:
      grund_text: "{{ grund | default('Unbekannt') }}"
      hygiene_modus: "{{ hygiene | default(false) }}"
      bereits_an: "{{ is_state('switch.charge','on') }}"
      verfuegbar: "{{ states('switch.charge') not in ['unknown','unavailable'] }}"
      temp_gueltig: "{{ is_state('binary_sensor.ww_v2_pflichtdaten_gueltig','on') }}"
      ziel: >-
        {{ states('input_number.ww_v2_hygiene_ziel') | float(60)
           if hygiene_modus else states('sensor.ww_v2_effektives_ziel') | float(51) }}
      energy_entity: "{{ states('input_text.ww_v2_wp_energy_entity') }}"
    sequence:
      - if:
          - condition: template
            value_template: "{{ not verfuegbar }}"
        then:
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_ladung_starten
              decision: Abgebrochen
              reason: "switch.charge nicht verfuegbar"
              action: keine
              result: Fehlgeschlagen
              severity: error
              error: "switch.charge Zustand: {{ states('switch.charge') }}"
          - stop: "switch.charge nicht verfuegbar"
      - if:
          - condition: template
            value_template: "{{ not temp_gueltig and not hygiene_modus }}"
        then:
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_ladung_starten
              decision: Abgebrochen
              reason: Warmwassertemperatur ungueltig
              action: keine
              result: Blockiert
              severity: warning
          - stop: "Warmwassertemperatur ungueltig"
      - if:
          - condition: template
            value_template: "{{ bereits_an }}"
        then:
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_ladung_starten
              decision: Kein erneuter Start
              reason: "{{ grund_text }} – Ladung laeuft bereits"
              action: keine
              result: Uebersprungen
              severity: info
              send_pushover: false
          - stop: "Ladung laeuft bereits"
      - condition: state
        entity_id: input_boolean.ww_v2_aktiv
        state: "on"
      - service: number.set_value
        target:
          entity_id: number.charge_setpoint
        data:
          value: "{{ ziel }}"
      - service: number.set_value
        target:
          entity_id: number.charge_duration
        data:
          value: 180
      - service: switch.turn_on
        target:
          entity_id: switch.charge
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_letzter_grund
        data:
          value: "{{ grund_text }} (Ziel {{ ziel }}C)"
      - service: input_text.set_value
        target:
          entity_id: input_text.ww_v2_aktive_strategie
        data:
          value: "{{ grund_text }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ww_v2_letzte_ladung
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - if:
          - condition: template
            value_template: "{{ energy_entity not in ['unknown','unavailable',''] and states(energy_entity) not in ['unknown','unavailable'] }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.ww_v2_wp_energy_start
            data:
              value: "{{ states(energy_entity) | float(0) }}"
      - service: counter.increment
        target:
          entity_id: counter.ww_v2_ladungen_heute
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_ladung_starten
          decision: Ladung gestartet
          reason: "{{ grund_text }}"
          action: "switch.charge einschalten, Ziel {{ ziel }} C"
          result: Erfolgreich
          severity: info

# =============================================================================
# Automationen
# =============================================================================
automation:
  - id: ww_v2_p0_kritisch
    alias: WW V2 - P0 Kritischer Schutz
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.ww_v2_kritischer_bedarf
        to: "on"
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_aktiv
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_pflichtdaten_gueltig
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_kritischer_bedarf
        state: "on"
      - condition: state
        entity_id: switch.charge
        state: "off"
    action:
      - service: script.ww_v2_ladung_starten
        data:
          grund: P0 Kritischer Schutz

  - id: ww_v2_wirtschaftliche_ladung
    alias: WW V2 - Wirtschaftliche Ladeentscheidung
    mode: single
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.ww_v2_pv_ueberschuss
          - binary_sensor.home_bestpreis_zeitraum
          - binary_sensor.ww_v2_ladebedarf
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_aktiv
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_pflichtdaten_gueltig
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_ladebedarf
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_antitakt_frei
        state: "on"
      - condition: state
        entity_id: switch.charge
        state: "off"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.ww_v2_pv_ueberschuss
                state: "on"
              - condition: state
                entity_id: binary_sensor.ww_v2_eigenverbrauch_wirtschaftlich
                state: "on"
            sequence:
              - service: script.ww_v2_ladung_starten
                data:
                  grund: P2 PV wirtschaftlich
          - conditions:
              - condition: state
                entity_id: binary_sensor.ww_v2_tibber_wirtschaftlich
                state: "on"
            sequence:
              - service: script.ww_v2_ladung_starten
                data:
                  grund: P3 Tibber Leading24
        default:
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_wirtschaftliche_ladung
              decision: Warten
              reason: >-
                {% if states('sensor.ww_v2_pv_forecast_naechste_stunde_gesamt') | float(0) >= (states('input_number.ww_v2_schwache_pv_schwelle') | float(10) / 4) %}
                PV-Ertrag in Kuerze erwartet, aktuell weder Ueberschuss noch wirtschaftlicher Preis
                {% else %}
                Kein PV-Ueberschuss, kein wirtschaftlicher Preis, kein kurzfristiger PV-Ertrag erwartet
                {% endif %}
              action: keine
              result: Zurueckgestellt
              severity: info
              send_pushover: false

  - id: ww_v2_debug_blockade
    alias: WW V2 - Debug Blockierte Ladung
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.ww_v2_ladebedarf
          - binary_sensor.ww_v2_antitakt_frei
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_debug_mode
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_ladebedarf
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_antitakt_frei
        state: "off"
    action:
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_debug_blockade
          decision: Blockiert
          reason: Anti-Takt-Sperre aktiv
          action: keine
          result: Blockiert durch Sperrzeit
          severity: info

  - id: ww_v2_nachtgarantie
    alias: WW V2 - Nachtgarantie 04:00
    mode: single
    trigger:
      - platform: time
        at: "04:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_aktiv
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_pflichtdaten_gueltig
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_komfortbedarf
        state: "on"
    action:
      - service: script.ww_v2_ladung_starten
        data:
          grund: P4 Nachtgarantie 04:00
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.ww_v2_nachtladung_erfolgt

  - id: ww_v2_stop_ziel
    alias: WW V2 - Stop am effektiven Ziel
    mode: single
    trigger:
      - platform: template
        value_template: >-
          {% set hygiene_laeuft = 'Hygiene' in states('input_text.ww_v2_aktive_strategie') %}
          {% set ziel = states('input_number.ww_v2_hygiene_ziel') | float(60)
             if hygiene_laeuft else states('sensor.ww_v2_effektives_ziel') | float(51) %}
          {{ states('sensor.ww_v2_warmwassertemperatur') | float(0) >= ziel }}
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: switch.charge
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_mindestlaufzeit_erreicht
        state: "on"
      - condition: template
        value_template: >-
          {% set hygiene_laeuft = 'Hygiene' in states('input_text.ww_v2_aktive_strategie') %}
          {% set ziel = states('input_number.ww_v2_hygiene_ziel') | float(60)
             if hygiene_laeuft else states('sensor.ww_v2_effektives_ziel') | float(51) %}
          {{ states('sensor.ww_v2_warmwassertemperatur') | float(0) >= ziel }}
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.charge
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ww_v2_letztes_ladeende
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_stop_ziel
          trigger: Zieltemperatur erreicht
          decision: Ladung gestoppt
          reason: "Warmwasser {{ states('sensor.ww_v2_warmwassertemperatur') }} C >= Ziel"
          action: switch.charge ausschalten
          result: Erfolgreich
          severity: info

  # Neue Sicherheitsfunktion (Funktionsmatrix F19): schliesst die in der
  # Analyse dokumentierte Luecke, dass ein Neustart waehrend eines
  # wait_template (z. B. im Hygienezyklus) eine Ladung theoretisch unbegrenzt
  # weiterlaufen lassen koennte.
  - id: ww_v2_sicherheitsabschaltung_maxdauer
    alias: WW V2 - Sicherheitsabschaltung maximale Ladedauer
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: switch.charge
        state: "on"
      - condition: template
        value_template: >-
          {% set letzte = states('input_datetime.ww_v2_letzte_ladung') %}
          {{ letzte not in ['unknown','unavailable','']
             and (now() - as_datetime(letzte)).total_seconds() / 60
                 >= (states('input_number.ww_v2_max_ladedauer_minuten') | float(150)) }}
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.charge
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ww_v2_letztes_ladeende
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_sicherheitsabschaltung_maxdauer
          decision: Sicherheitsabschaltung
          reason: "Maximale Ladedauer ({{ states('input_number.ww_v2_max_ladedauer_minuten') }} min) ueberschritten"
          action: switch.charge zwangsweise ausschalten
          result: Sicherheitsabschaltung ausgefuehrt
          severity: critical

  - id: ww_v2_hygiene_pruefung
    alias: WW V2 - Optionaler Hygienezyklus
    mode: single
    trigger:
      - platform: time
        at: "02:00:00"
    condition:
      - condition: time
        weekday:
          - sun
      - condition: state
        entity_id: input_boolean.ww_v2_hygiene_aktiv
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_hygiene_faellig
        state: "on"
      - condition: state
        entity_id: binary_sensor.ww_v2_pflichtdaten_gueltig
        state: "on"
    action:
      - service: script.ww_v2_ladung_starten
        data:
          grund: P5 Optionaler Hygienezyklus
          hygiene: true
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_hygiene_pruefung
          decision: Hygienezyklus gestartet
          reason: Temperatur-Maximum 7 Tage unter Hygieneziel
          action: "switch.charge einschalten, Ziel {{ states('input_number.ww_v2_hygiene_ziel') }} C"
          result: Gestartet
          severity: info
      - wait_template: >-
          {{ states('sensor.ww_v2_warmwassertemperatur') | float(0)
             >= states('input_number.ww_v2_hygiene_ziel') | float(60) }}
        timeout: "02:30:00"
        continue_on_timeout: true
      - service: switch.turn_off
        target:
          entity_id: switch.charge
      - if:
          - condition: template
            value_template: >-
              {{ states('sensor.ww_v2_warmwassertemperatur') | float(0)
                 >= states('input_number.ww_v2_hygiene_ziel') | float(60) }}
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ww_v2_letzter_hygienezyklus
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.ww_v2_hygiene_erfolgt
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_hygiene_pruefung
              decision: Hygienezyklus erfolgreich
              reason: Zieltemperatur erreicht
              action: switch.charge ausschalten
              result: Erfolgreich
              severity: info
        else:
          - service: script.ww_v2_debug_log
            data:
              source: ww_v2_hygiene_pruefung
              decision: Hygienezyklus abgebrochen
              reason: "Zeitlimit 2:30h erreicht, Zieltemperatur nicht erreicht"
              action: switch.charge ausschalten
              result: Zeitueberschreitung
              severity: warning

  - id: ww_v2_lernen_nacht_snapshot
    alias: WW V2 - Nacht-Referenz 22:00
    trigger:
      - platform: time
        at: "22:00:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_nacht_referenz
        data:
          value: "{{ states('sensor.ww_v2_warmwassertemperatur') | float(50) }}"

  - id: ww_v2_lernen_nacht
    alias: WW V2 - Nachtverlust lernen 05:25
    trigger:
      - platform: time
        at: "05:25:00"
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_nachtladung_erfolgt
        state: "off"
    action:
      - variables:
          alt: "{{ states('input_number.ww_v2_nachtverlust_gelernt') | float(4) }}"
          neu: >-
            {{ [states('input_number.ww_v2_nacht_referenz') | float(50)
                - states('sensor.ww_v2_warmwassertemperatur') | float(50), 0] | max }}
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_nachtverlust_gelernt
        data:
          value: "{{ (alt * 0.7 + neu * 0.3) | round(1) }}"

  - id: ww_v2_verbrauch_snapshot_morgen
    alias: WW V2 - Verbrauch Morgen Snapshot 05:30
    trigger:
      - platform: time
        at: "05:30:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_verbrauch_referenz
        data:
          value: "{{ states('sensor.ww_v2_warmwassertemperatur') | float(50) }}"

  - id: ww_v2_verbrauch_lernen_morgen
    alias: WW V2 - Verbrauch Morgen lernen 09:00
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: state
        entity_id: switch.charge
        state: "off"
    action:
      - variables:
          alt: "{{ states('input_number.ww_v2_verbrauch_morgen_gelernt') | float(4) }}"
          neu: >-
            {{ [states('input_number.ww_v2_verbrauch_referenz') | float(50)
                - states('sensor.ww_v2_warmwassertemperatur') | float(50), 0] | max }}
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_verbrauch_morgen_gelernt
        data:
          value: "{{ (alt * 0.75 + neu * 0.25) | round(1) }}"

  - id: ww_v2_verbrauch_snapshot_abend
    alias: WW V2 - Verbrauch Abend Snapshot 17:00
    trigger:
      - platform: time
        at: "17:00:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_verbrauch_referenz
        data:
          value: "{{ states('sensor.ww_v2_warmwassertemperatur') | float(50) }}"

  - id: ww_v2_verbrauch_lernen_abend
    alias: WW V2 - Verbrauch Abend lernen 21:00
    trigger:
      - platform: time
        at: "21:00:00"
    condition:
      - condition: state
        entity_id: switch.charge
        state: "off"
    action:
      - variables:
          alt: "{{ states('input_number.ww_v2_verbrauch_abend_gelernt') | float(3) }}"
          neu: >-
            {{ [states('input_number.ww_v2_verbrauch_referenz') | float(50)
                - states('sensor.ww_v2_warmwassertemperatur') | float(50), 0] | max }}
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_verbrauch_abend_gelernt
        data:
          value: "{{ (alt * 0.75 + neu * 0.25) | round(1) }}"

  - id: ww_v2_kostenabschluss
    alias: WW V2 - Kosten und Energie erfassen
    trigger:
      - platform: state
        entity_id: switch.charge
        from: "on"
        to: "off"
    variables:
      e: "{{ states('input_text.ww_v2_wp_energy_entity') }}"
      start: "{{ states('input_number.ww_v2_wp_energy_start') | float(0) }}"
      ende: "{{ states(e) | float(0) if e not in ['unknown','unavailable',''] else 0 }}"
      verbrauch: "{{ [ende - start, 0] | max }}"
      pv: "{{ 'PV' in states('input_text.ww_v2_letzter_grund') }}"
      preis_eur: "{{ states('sensor.ww_v2_tibber_preis') | float(0) / 100 }}"
      einspeise_eur: "{{ states('input_number.ww_v2_einspeiseverguetung') | float(8) / 100 }}"
    condition:
      - condition: template
        value_template: "{{ e not in ['unknown','unavailable',''] and verbrauch | float(0) > 0 }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_kosten_heute
        data:
          value: >-
            {{ (states('input_number.ww_v2_kosten_heute') | float(0)
                + verbrauch * (einspeise_eur if pv else preis_eur)) | round(2) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.ww_v2_einsparung_heute
        data:
          value: >-
            {{ (states('input_number.ww_v2_einsparung_heute') | float(0)
                + (verbrauch | float(0)) * ([preis_eur - einspeise_eur, 0] | max if pv else 0)) | round(2) }}
      - choose:
          - conditions: "{{ pv }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.ww_v2_pv_energie_heute
                data:
                  value: >-
                    {{ (states('input_number.ww_v2_pv_energie_heute') | float(0) + verbrauch) | round(2) }}
        default:
          - service: input_number.set_value
            target:
              entity_id: input_number.ww_v2_netz_energie_heute
            data:
              value: >-
                {{ (states('input_number.ww_v2_netz_energie_heute') | float(0) + verbrauch) | round(2) }}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ww_v2_letztes_ladeende
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_kostenabschluss
          decision: Kosten erfasst
          reason: "{{ 'PV-Nutzung' if pv else 'Netzbezug' }}, Verbrauch {{ verbrauch | round(3) }} kWh"
          action: keine
          result: Erfolgreich
          severity: info
          send_pushover: false

  - id: ww_v2_debug_strategiewechsel
    alias: WW V2 - Debug Strategiewechsel
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.ww_v2_aktive_strategie
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_debug_mode
        state: "on"
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}"
    action:
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_debug_strategiewechsel
          trigger: Strategiewechsel
          decision: "{{ trigger.from_state.state }} -> {{ trigger.to_state.state }}"
          reason: "Naechste Ladung: {{ states('sensor.ww_v2_naechste_ladung') }}"
          action: keine
          result: Information
          severity: info

  - id: ww_v2_debug_sensorfehler
    alias: WW V2 - Debug Sensorausfall
    mode: queued
    trigger:
      - platform: state
        entity_id:
          - sensor.ww_v2_warmwassertemperatur
          - sensor.ww_v2_tibber_preis
          - sensor.energy_production_today
          - sensor.energy_production_today_2
        to:
          - unknown
          - unavailable
        for: "00:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.ww_v2_debug_mode
        state: "on"
    action:
      - service: script.ww_v2_debug_log
        data:
          source: ww_v2_debug_sensorfehler
          trigger: "{{ trigger.entity_id }}"
          decision: Sensorausfall erkannt
          reason: "{{ trigger.entity_id }} seit mehr als 5 Minuten nicht verfuegbar"
          action: keine
          result: Warnung
          severity: warning

  - id: ww_v2_debug_test_button
    alias: WW V2 - Debug Testbutton
    trigger:
      - platform: state
        entity_id: input_button.ww_v2_debug_test
    action:
      - service: script.ww_v2_pushover_test

  - id: ww_v2_regelungsdurchlauf_heartbeat
    alias: WW V2 - Regelungsdurchlauf Heartbeat
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    action:
      - if:
          - condition: state
            entity_id: binary_sensor.ww_v2_pflichtdaten_gueltig
            state: "on"
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ww_v2_letzter_erfolgreicher_durchlauf
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        else:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ww_v2_letzter_uebersprungener_durchlauf
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: input_text.set_value
            target:
              entity_id: input_text.ww_v2_status_result
            data:
              value: "Durchlauf uebersprungen: Pflichtdaten ungueltig ({{ states('sensor.ww_v2_diagnose_pflichtentities') }})"

  - id: ww_v2_reset
    alias: WW V2 - Tagesreset
    trigger:
      - platform: time
        at: "00:00:05"
    action:
      - service: counter.reset
        target:
          entity_id: counter.ww_v2_ladungen_heute
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ww_v2_nachtladung_erfolgt
